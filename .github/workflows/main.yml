name: Java CI with Maven and Reports (Java 21)

on:
  push:
    branches: [ "actions" ]
  pull_request:
    branches: [ "actions" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Запуск тестов конкретного модуля
      - name: Run tests with Maven
        run: mvn clean verify -pl regression-core -am
        continue-on-error: true

      # Сборка и выгрузка отчетов
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java21
          path: |
            regression-core/target/surefire-reports/
            regression-core/target/cucumber-reports/
          retention-days: 5