openapi: 3.0.3
info:
  title: OWASP Juice Shop Functional Test API
  version: 1.0.0
  description: |
    Test-oriented contract for a local OWASP Juice Shop instance.
    It combines the documented B2B API with the REST and Sequelize-backed
    endpoints used by the Juice Shop web UI. The latter are implementation
    endpoints and can change between Juice Shop releases.
servers:
  - url: http://localhost:3000
    description: Local Docker instance

tags:
  - name: Authentication
  - name: Users
  - name: Products
  - name: Reviews
  - name: Basket
  - name: Checkout
  - name: Addresses
  - name: Cards
  - name: Delivery
  - name: Feedback
  - name: Captcha
  - name: Profile
  - name: Two-factor authentication
  - name: Wallet
  - name: Deluxe membership
  - name: B2B

paths:
  /rest/user/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rest/user/whoami:
    get:
      tags: [Authentication]
      operationId: whoAmI
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Current authentication state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmIResponse'

  /rest/user/authentication-details:
    get:
      tags: [Authentication]
      operationId: getAuthenticationDetails
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authentication details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/Users:
    post:
      tags: [Users]
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/SecurityQuestions:
    get:
      tags: [Users]
      operationId: getSecurityQuestions
      responses:
        '200':
          description: Available security questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityQuestionListResponse'

  /api/SecurityAnswers:
    post:
      tags: [Users]
      operationId: createSecurityAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityAnswerRequest'
      responses:
        '201':
          description: Security answer stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /rest/user/security-question:
    get:
      tags: [Users]
      operationId: getSecurityQuestionForUser
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Security question assigned to the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityQuestionResponse'

  /rest/user/reset-password:
    post:
      tags: [Users]
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rest/user/change-password:
    get:
      tags: [Users]
      operationId: changePassword
      security:
        - bearerAuth: []
      parameters:
        - name: current
          in: query
          schema:
            type: string
        - name: new
          in: query
          required: true
          schema:
            type: string
        - name: repeat
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Password change result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/Products:
    get:
      tags: [Products]
      operationId: getProducts
      responses:
        '200':
          description: Product catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /api/Products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /rest/products/search:
    get:
      tags: [Products]
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /rest/products/{id}/reviews:
    get:
      tags: [Reviews]
      operationId: getProductReviews
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Product reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
    put:
      tags: [Reviews]
      operationId: updateProductReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdateRequest'
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

  /rest/products/reviews:
    post:
      tags: [Reviews]
      operationId: createProductReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Created review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
    patch:
      tags: [Reviews]
      operationId: likeProductReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewLikeRequest'
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

  /rest/basket/{id}:
    get:
      tags: [Basket]
      operationId: getBasket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Basket with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/BasketItems:
    post:
      tags: [Basket]
      operationId: addBasketItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketItemCreateRequest'
      responses:
        '201':
          description: Basket item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/BasketItems/{id}:
    put:
      tags: [Basket]
      operationId: updateBasketItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketItemUpdateRequest'
      responses:
        '200':
          description: Basket item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItemResponse'
    delete:
      tags: [Basket]
      operationId: deleteBasketItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Basket item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /rest/basket/{id}/coupon/{coupon}:
    put:
      tags: [Basket]
      operationId: applyCoupon
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: coupon
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coupon result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponResponse'

  /rest/basket/{id}/checkout:
    post:
      tags: [Checkout]
      operationId: checkoutBasket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Checkout result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'

  /rest/order-history:
    get:
      tags: [Checkout]
      operationId: getOrderHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user's orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryResponse'

  /rest/track-order/{id}:
    get:
      tags: [Checkout]
      operationId: trackOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order tracking data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackOrderResponse'

  /api/Addresss:
    get:
      tags: [Addresses]
      operationId: getAddresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
    post:
      tags: [Addresses]
      operationId: createAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'

  /api/Addresss/{id}:
    get:
      tags: [Addresses]
      operationId: getAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
    put:
      tags: [Addresses]
      operationId: updateAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Address deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/Cards:
    get:
      tags: [Cards]
      operationId: getCards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User payment cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardListResponse'
    post:
      tags: [Cards]
      operationId: createCard
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreateRequest'
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/Cards/{id}:
    get:
      tags: [Cards]
      operationId: getCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Payment card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
    delete:
      tags: [Cards]
      operationId: deleteCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Card deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/Deliverys:
    get:
      tags: [Delivery]
      operationId: getDeliveryMethods
      responses:
        '200':
          description: Available delivery methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryListResponse'

  /api/Deliverys/{id}:
    get:
      tags: [Delivery]
      operationId: getDeliveryMethod
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Delivery method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'

  /rest/captcha:
    get:
      tags: [Captcha]
      operationId: getCaptcha
      responses:
        '200':
          description: Text captcha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaResponse'

  /rest/image-captcha:
    get:
      tags: [Captcha]
      operationId: getImageCaptcha
      responses:
        '200':
          description: Image captcha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCaptchaResponse'

  /api/Feedbacks:
    post:
      tags: [Feedback]
      operationId: createFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreateRequest'
      responses:
        '201':
          description: Feedback created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'

  /rest/languages:
    get:
      tags: [Profile]
      operationId: getLanguages
      responses:
        '200':
          description: Supported UI languages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageListResponse'

  /rest/memories:
    get:
      tags: [Profile]
      operationId: getMemories
      responses:
        '200':
          description: Photo wall memories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'

  /rest/2fa/status:
    get:
      tags: [Two-factor authentication]
      operationId: getTwoFactorStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Two-factor status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatusResponse'

  /rest/2fa/setup:
    post:
      tags: [Two-factor authentication]
      operationId: setupTwoFactor
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorSetupRequest'
      responses:
        '200':
          description: Two-factor setup data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetupResponse'

  /rest/2fa/verify:
    post:
      tags: [Two-factor authentication]
      operationId: verifyTwoFactor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /rest/2fa/disable:
    post:
      tags: [Two-factor authentication]
      operationId: disableTwoFactor
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
      responses:
        '200':
          description: Disable result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /rest/wallet/balance:
    get:
      tags: [Wallet]
      operationId: getWalletBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
    put:
      tags: [Wallet]
      operationId: topUpWallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTopUpRequest'
      responses:
        '200':
          description: Updated wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'

  /rest/deluxe-membership:
    get:
      tags: [Deluxe membership]
      operationId: getDeluxeMembership
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Membership status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeluxeMembershipResponse'
    post:
      tags: [Deluxe membership]
      operationId: purchaseDeluxeMembership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeluxeMembershipRequest'
      responses:
        '200':
          description: Membership purchase result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeluxeMembershipResponse'

  /b2b/v2/orders:
    post:
      tags: [B2B]
      operationId: createCustomerOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B2BOrder'
      responses:
        '200':
          description: Customer order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BOrderConfirmation'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or credentials rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        error:
          type: string

    MessageResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        message:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - authentication
      properties:
        authentication:
          $ref: '#/components/schemas/Authentication'

    Authentication:
      type: object
      additionalProperties: false
      required:
        - token
        - bid
        - umail
      properties:
        token:
          type: string
        bid:
          type: integer
          format: int64
        umail:
          type: string
          format: email

    WhoAmIResponse:
      type: object
      additionalProperties: true
      properties:
        user:
          $ref: '#/components/schemas/User'

    AuthenticationDetailsResponse:
      type: object
      additionalProperties: true
      properties:
        data:
          $ref: '#/components/schemas/AuthenticationDetails'

    AuthenticationDetails:
      type: object
      additionalProperties: true
      properties:
        email:
          type: string
        lastLoginIp:
          type: string
        profileImage:
          type: string
        deluxeToken:
          type: string

    User:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        isActive:
          type: boolean
        deluxeToken:
          type: string
          nullable: true
        profileImage:
          type: string

    UserRegistrationRequest:
      type: object
      required: [email, password, passwordRepeat, securityQuestion, securityAnswer]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        passwordRepeat:
          type: string
          format: password
        securityQuestion:
          $ref: '#/components/schemas/SecurityQuestion'
        securityAnswer:
          type: string

    UserResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        data:
          $ref: '#/components/schemas/User'

    SecurityQuestion:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
        question:
          type: string

    SecurityQuestionListResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/SecurityQuestion'

    SecurityQuestionResponse:
      type: object
      additionalProperties: true
      properties:
        question:
          $ref: '#/components/schemas/SecurityQuestion'

    SecurityAnswerRequest:
      type: object
      required: [UserId, SecurityQuestionId, answer]
      properties:
        UserId:
          type: integer
          format: int64
        SecurityQuestionId:
          type: integer
          format: int64
        answer:
          type: string

    SecurityAnswer:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
        UserId:
          type: integer
          format: int64
        SecurityQuestionId:
          type: integer
          format: int64
        answer:
          type: string

    SecurityAnswerResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        data:
          $ref: '#/components/schemas/SecurityAnswer'

    PasswordResetRequest:
      type: object
      required: [email, answer, new, repeat]
      properties:
        email:
          type: string
          format: email
        answer:
          type: string
        new:
          type: string
          format: password
        repeat:
          type: string
          format: password

    Product:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        deluxePrice:
          type: number
          format: double
        image:
          type: string
        deletedAt:
          type: string
          format: date-time
          nullable: true

    ProductResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        data:
