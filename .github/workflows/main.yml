name: Java CI with Maven and Reports (Java 21)

on:
  push:
    branches: [ "master", "actions" ]
  pull_request:
    branches: [ "master", "actions" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests with Maven
        run: mvn clean verify -pl regression-core -am -Denv=dev
        continue-on-error: true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-java21
          path: |
            regression-core/target/surefire-reports/
            regression-core/target/cucumber-reports/
          retention-days: 5